name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk calculator-zarplaty.apk

      - name: Сохранить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: calculator-zarplaty-apk
          path: calculator-zarplaty.apk

      - name: Выложить APK в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Калькулятор зарплаты, сборка ${{ github.run_number }}
          files: calculator-zarplaty.apk
          make_latest: true
